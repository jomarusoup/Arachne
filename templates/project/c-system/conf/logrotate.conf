################################################################################
# FILE NAME   : logrotate.conf
# DESCRIPTION : C 서버 운영 로그 회전 템플릿 — rename 후 SIGHUP으로 재오픈
################################################################################
# 설치: /etc/logrotate.d/<서비스> 로 복사하고 <...> 자리표시자를 바꾼다.
# 점검: logrotate -d /etc/logrotate.d/<서비스>   (실제로 돌리지 않고 계획만 출력)
#
# 재오픈 방식(기본):
#   logrotate가 파일을 rename 한다 → postrotate가 SIGHUP을 보낸다 →
#   SIGHUP 핸들러는 LogRequestReopen()으로 플래그만 세운다 →
#   메인 루프가 LogReopenIfRequested()를 불러 같은 경로로 새 파일을 연다.
#   rename 후 재오픈 전까지의 줄은 이전 파일(.1)에 이어서 들어가므로 유실이 없다.
#
# copytruncate 트레이드오프:
#   copytruncate는 신호 없이 동작한다. 재오픈을 구현하지 못한 프로그램에만 쓴다.
#   복사와 truncate 사이에 쓴 줄은 유실된다. 큰 파일은 복사 비용이 크다.
#   O_APPEND로 열지 않은 프로그램은 truncate 뒤 원래 위치에 써서 앞부분이 NUL로 채워진다.
#   이 템플릿의 로거는 재오픈을 지원하므로 copytruncate를 쓰지 않는다.
#
# 보존 기간: rotate × 회전 주기. 개인정보가 섞일 수 있는 로그는 보존 기간이 지나면
# 파기한다(skills/sensitive-data-handling). 아래 기본값은 일 단위 30일이다.
################################################################################

/var/log/<서비스>/*.log {
    daily
    rotate 30
    maxsize 500M
    missingok
    notifempty
    compress
    delaycompress
    dateext
    create 0640 <실행계정> <그룹>
    sharedscripts
    postrotate
        # 프로세스별 pid 파일마다 SIGHUP을 보낸다. 실패해도 회전은 계속한다.
        for pidfile in /run/<서비스>/*.pid; do
            [ -f "$pidfile" ] && kill -HUP "$(cat "$pidfile")" 2>/dev/null || true
        done
    endscript
}
