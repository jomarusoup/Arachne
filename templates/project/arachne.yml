################################################################################
# FILE NAME   : arachne.yml
# DESCRIPTION : Arachne 사용 프로젝트의 GitHub Actions 검증 workflow
# DATA        : 2026-06-09
# Modification: 2026-06-09
################################################################################

name: Arachne Project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  project-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect Arachne profile
        id: profile
        shell: bash
        run: |
          profile="$(cat .arachne/profile 2>/dev/null || printf 'minimal')"
          python=false
          web=false
          rust=false
          case "$profile" in
            minimal)
              ;;
            python)
              python=true
              ;;
            web)
              web=true
              ;;
            python-web)
              python=true
              web=true
              ;;
            cpp)
              # gcc·cmake·ctest 는 ubuntu-latest 러너에 사전 설치 — 별도 셋업 불필요
              ;;
            rust)
              rust=true
              ;;
            *)
              echo "::error::Unknown Arachne profile: $profile"
              exit 1
              ;;
          esac
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.profile.outputs.python == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        if: steps.profile.outputs.python == 'true'
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Node.js
        if: steps.profile.outputs.web == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Enable Corepack
        if: steps.profile.outputs.web == 'true'
        run: corepack enable

      - name: Set up Rust
        if: steps.profile.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run project verification
        run: bash .arachne/verify.sh
