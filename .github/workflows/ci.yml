name: CI

# 자기규칙 강제: 하네스가 강제하는 shellcheck·bats·인덱스 일치를 스스로 검증한다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck & bats
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck bats

      - name: Shellcheck (모든 셸 스크립트 — glob 으로 드리프트 차단)
        run: shellcheck -S warning ./*.sh hooks/*.sh tests/*.sh

      - name: Bats (전체 *.bats — 새 테스트 자동 포함)
        run: bats tests/*.bats

      - name: settings.json 템플릿 검증
        run: bash tests/validate_settings.sh

      - name: 인덱스 ↔ 실제 파일 일치
        run: bash tests/check_index.sh

  verify-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PowerShell 설치기 검증
        shell: pwsh
        run: ./tests/install_windows.ps1
