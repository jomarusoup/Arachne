name: CI

# 자기규칙 강제: 하네스가 강제하는 shellcheck·bats·인덱스 일치를 스스로 검증한다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 검증 전용 CI — 저장소 내용 읽기만 필요 (최소 권한, 프로젝트 템플릿 arachne.yml 과 동일 정책)
permissions:
  contents: read

jobs:
  verify-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Ubuntu verification tools
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck bats jq ripgrep

      - name: Shellcheck (모든 셸 스크립트 — glob 으로 드리프트 차단)
        run: shellcheck -S warning ./*.sh lib/*.sh hooks/*.sh tests/*.sh templates/project/sql/*.sh templates/project/c-system/tools/*.sh templates/project/compose-3tier/schema/*.sh

      - name: PowerShell 구문 검사 (Linux pwsh — Windows 러너 전 조기 차단)
        shell: pwsh
        run: ./tests/check_ps_syntax.ps1

      - name: Bats (전체 *.bats — 새 테스트 자동 포함)
        run: bats tests/*.bats

      - name: settings.json 템플릿 검증
        run: bash tests/validate_settings.sh

      - name: 인덱스 ↔ 실제 파일 일치
        run: bash tests/check_index.sh

      - name: 규약 동기화 (AGENTS.md ↔ rules)
        run: bash tests/check_convention_sync.sh

      - name: 민감 텍스트 (개인 경로·비밀값·개인정보)
        run: bash tests/check_sensitive_text.sh

      - name: 숨은 유니코드 (지시 파일)
        run: bash tests/check_unicode_safety.sh

      - name: Node (TS 디코더·클라이언트 예제용 타입 제거 실행)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: C 시스템 템플릿 빌드·테스트 (Linux — robust 뮤텍스 등 리눅스 전용 경로 포함)
        run: |
          for dir in shm log pipeline contract; do
            make -C "templates/project/c-system/src/${dir}" test
          done
          make -C templates/project/c-system/src/contract ts-test layout
          make -C templates/project/c-system/tools test
          make -C templates/project/c-system/examples/ffi-rust test
          make -C templates/project/throughput-poc
          node --test templates/project/desktop-data-client/

      - name: 3티어 compose 스모크 (C 빌드 테스트 · PostgreSQL · 스키마 적용)
        working-directory: templates/project/compose-3tier
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up --build --abort-on-container-exit --exit-code-from c-build c-build
          docker compose up -d --wait postgres
          docker compose run --rm schema-pg
          docker compose run --rm schema-pg   # 재실행 — 적용된 버전은 건너뛰어야 한다
          docker compose down -v

  # 데이터 계약 게이트 — uv 가용 환경에서 alembic·pytest 실행 검증까지 수행
  # (다른 job 의 bats 는 uv 가 없어 정적 계약 검사만 수행)
  verify-data-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y bats jq

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        # setup-uv 는 v8 메이저 별칭 태그를 게시하지 않는다 — 정확한 버전 고정 필요
        uses: astral-sh/setup-uv@v8.2.0

      - name: 데이터 계약 게이트 (정적 + 실행 검증)
        run: bats tests/data_contract.bats

  verify-rocky:
    runs-on: ubuntu-latest
    container: rockylinux:9
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rocky verification tools
        run: |
          dnf install -y epel-release
          dnf install -y ShellCheck bats diffutils git jq

      - name: Shellcheck (RHEL/Rocky 패키지 기준)
        run: shellcheck -S warning ./*.sh lib/*.sh hooks/*.sh tests/*.sh templates/project/sql/*.sh templates/project/c-system/tools/*.sh templates/project/compose-3tier/schema/*.sh

      - name: Bats (RHEL/Rocky 런타임)
        run: bats tests/*.bats

      - name: settings.json 템플릿 검증
        run: bash tests/validate_settings.sh

      - name: 인덱스 ↔ 실제 파일 일치
        run: bash tests/check_index.sh

      - name: 규약 동기화 (AGENTS.md ↔ rules)
        run: bash tests/check_convention_sync.sh

      - name: 민감 텍스트 (개인 경로·비밀값·개인정보)
        run: bash tests/check_sensitive_text.sh

      - name: 숨은 유니코드 (지시 파일)
        run: bash tests/check_unicode_safety.sh

  verify-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: PowerShell 설치기 검증
        shell: pwsh
        run: ./tests/install_windows.ps1

      - name: Git Bash 훅 런타임 스모크 (#40)
        shell: bash
        run: bash tests/smoke_hooks.sh

  verify-macos:
    runs-on: macos-latest
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install macOS verification tools
        run: |
          brew install shellcheck bats-core jq coreutils bash
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"

      - name: Shellcheck (macOS)
        run: shellcheck -S warning ./*.sh lib/*.sh hooks/*.sh tests/*.sh templates/project/sql/*.sh templates/project/c-system/tools/*.sh templates/project/compose-3tier/schema/*.sh

      - name: Bats (macOS)
        run: bats tests/*.bats

      - name: settings.json 템플릿 검증
        run: bash tests/validate_settings.sh

      - name: 인덱스 ↔ 실제 파일 일치
        run: bash tests/check_index.sh

      - name: 규약 동기화 (AGENTS.md ↔ rules)
        run: bash tests/check_convention_sync.sh

      - name: 민감 텍스트 (개인 경로·비밀값·개인정보)
        run: bash tests/check_sensitive_text.sh

      - name: 숨은 유니코드 (지시 파일)
        run: bash tests/check_unicode_safety.sh
